version: 2
# Minor and patch updates arrive in one PR per ecosystem (uv, npm and docker monthly, GitHub Actions weekly). Major updates stay single PRs
# (they can break the build). Security updates ignore the schedule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    # Node 24 is the supported major (also in CI). Review Node major updates by hand.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
