name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
  # A weekly Windows run (the developer platform) and a manual run. Run it by hand: Actions, CI, Run workflow.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      windows:
        description: "Run on windows-latest (slower; costs more on private forks)"
        type: boolean
        default: true

permissions:
  contents: read

# Cancel an older run of the same PR when a new commit arrives. Never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests and pushes to main run on Linux (Windows is slower and costs more on private forks). Windows runs only
# on the weekly schedule and on a manual run. Draft PRs do not run CI; mark the PR ready to run it.
# The justfile sets the PowerShell shell for both (pwsh is preinstalled on ubuntu-latest).
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.windows)) && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Secret scan (gitleaks, MIT, binary pinned by checksum; runs on the runner, sends nothing out)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1 # keep in sync with the Dockerfile and local pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just setup
      - run: just lint
      - run: just test
      - run: pnpm --dir frontend build
      - name: Dependency audit (non-gating; sends package names and versions to the npm registry)
        continue-on-error: true
        run: pnpm --dir frontend audit --prod
